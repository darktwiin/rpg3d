<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPG 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #menu {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(10, 14, 24, 0.75); z-index: 10;
    }
    #menu .box { background: #1b2233; color: #eee; padding: 28px 32px; border-radius: 12px; width: 320px; text-align: center; box-shadow: 0 10px 40px #0008; }
    #menu h1 { margin: 0 0 6px; font-size: 26px; }
    #menu p { margin: 6px 0 16px; color: #9aa4b8; font-size: 14px; }
    #menu input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #3a4560; background: #0f1420; color: #fff; font-size: 16px; }
    #menu button { margin-top: 12px; width: 100%; padding: 11px; border: 0; border-radius: 8px; background: #4f7cff; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    #menu button:hover { background: #6a90ff; }
    #menu label { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 12px; font-size: 14px; color: #c6cddd; }
    #menu .keys { margin-top: 16px; font-size: 13px; color: #9aa4b8; line-height: 1.6; text-align: left; }
    #hud { position: fixed; left: 12px; top: 10px; color: #fff; font-size: 13px; text-shadow: 0 1px 3px #000; pointer-events: none; }
    #version { position: fixed; right: 10px; bottom: 8px; color: #fff9; font-size: 12px; pointer-events: none; }
    #status { position: fixed; right: 12px; top: 10px; color: #fff; font-size: 13px; text-shadow: 0 1px 3px #000; pointer-events: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                   "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="menu">
    <div class="box">
      <h1>RPG 3D</h1>
      <p>Choisis un nom puis clique sur Jouer</p>
      <input id="name" maxlength="16" placeholder="Ton pseudo">
      <label><input type="checkbox" id="fs" checked> Plein écran</label>
      <button id="play">Jouer</button>
      <div class="keys">
        <b>ZQSD / WASD</b> : se déplacer<br>
        <b>Souris</b> : tourner la caméra · <b>Molette</b> : zoom<br>
        <b>Espace</b> : sauter · <b>Maj</b> : courir<br>
        <b>Échap</b> : libérer la souris (re-clique pour reprendre)
      </div>
    </div>
  </div>
  <div id="hud"></div>
  <div id="status">Connexion…</div>
  <div id="version">ver.0.0.1</div>
  <script type="module" src="game.js"></script>
</body>
</html>
